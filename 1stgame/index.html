<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Betting Game</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #121212; color: #fff; margin: 0; padding: 15px; padding-bottom: 80px; }
  .sticky-header { position: sticky; top: 0; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid #333; }
  .coins-badge { font-size: 1.2rem; font-weight: bold; color: #ffd700; }
  .status-pill { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
  .status-open { background: #1f4d2b; color: #4caf50; }
  .status-locked { background: #4d3a1f; color: #ffb84d; }
  .status-revealed { background: #1f3a4d; color: #4da6ff; }
  .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2a2a2a; }
  .card h3 { margin-top: 0; color: #4da6ff; font-size: 1.1rem; display:flex; justify-content:space-between; align-items:center;}
  .q-total { font-size: 0.8rem; color: #888; font-weight: normal; }
  .options-list { font-size: 0.85rem; color: #ccc; line-height: 1.5; margin: 6px 0 14px; padding-left: 2px; }
  .options-list div { margin-bottom: 2px; }
  .input-group { display: flex; gap: 10px; margin-top: 10px; }
  .input-box { flex: 1; text-align: center; }
  .input-box label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #aaa; }
  .input-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #2b2b2b; color: #fff; text-align: center; font-size: 1rem; }
  .input-box.correct input { border-color: #28a745; box-shadow: 0 0 0 1px #28a745; }
  .input-box.wrong input { border-color: #ff4d4d; box-shadow: 0 0 0 1px #ff4d4d; opacity: 0.6; }
  .coin-input.over-budget { border-color: #ff4d4d !important; box-shadow: 0 0 0 1px #ff4d4d; background: #3a1f1f !important; animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .text-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2b2b2b; color: #fff; font-size: 1rem; margin-top: 5px; }
  button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
  button:disabled { background: #555; opacity: 0.6; cursor: not-allowed; }
  .summary-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
  .summary-table th, .summary-table td { border: 1px solid #444; padding: 8px; text-align: center; }
  .summary-table th { background: #333; }
  .summary-table tr.won { background: rgba(40,167,69,0.15); }
  .summary-table tr.lost { background: rgba(255,77,77,0.08); }
  .center { text-align: center; }
  .muted { color: #999; font-size: 0.9rem; }
  .big-emoji { font-size: 3rem; text-align: center; margin: 10px 0; }
  .spinner { border: 4px solid #333; border-top: 4px solid #4da6ff; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .leader-row { display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #2a2a2a; }
  .leader-row:first-child { color:#ffd700; font-weight:bold; }
  .rank { color:#888; width:28px; display:inline-block;}
  #errorBanner { background:#4d1f1f; color:#ff8080; padding:12px; border-radius:10px; margin-bottom:15px; display:none; }
  @media (max-width: 380px) {
    body { padding: 10px; }
    .sticky-header { flex-wrap: wrap; padding: 10px; gap: 6px; }
    .coins-badge { font-size: 1rem; }
    .input-group { gap: 6px; }
    .input-box input { padding: 8px 4px; font-size: 0.9rem; }
    .card { padding: 12px; }
    .summary-table { font-size: 0.75rem; }
    .summary-table th, .summary-table td { padding: 5px 3px; }
  }
</style>
</head>
<body>

<div class="sticky-header">
  <div>
    <strong id="headerTeamName">QUỸ XU</strong>
    <div><span class="status-pill" id="statusPill">...</span></div>
  </div>
  <div class="coins-badge" id="coinDisplay">100 / 100 xu</div>
</div>

<div id="countdownBanner" style="display:none; background:#1e1e1e; border:1px solid #ffb84d; color:#ffb84d; padding:12px; border-radius:10px; margin-bottom:15px; text-align:center; font-weight:bold; font-size:1.1rem;"></div>

<div id="errorBanner"></div>

<!-- BƯỚC 1: NHẬP TÊN ĐỘI -->
<div class="card" id="joinScreen">
  <h3>Bắt đầu</h3>
  <label class="muted">Nhập tên đội / nhóm của bạn:</label>
  <input type="text" id="teamNameInput" class="text-input" placeholder="VD: Nhóm Cú Đêm">
  <button id="joinBtn" onclick="joinTeam()">VÀO TRÒ CHƠI</button>
  <div style="text-align:center; margin-top:14px;">
    <a href="#" onclick="showPublicResults(); return false;" style="color:#4da6ff; font-size:0.85rem; text-decoration:none;">🏆 Xem bảng xếp hạng &amp; đáp án đúng</a>
  </div>
</div>

<!-- MÀN HÌNH XEM CÔNG KHAI (không cần tham gia đội) -->
<div id="publicResultsScreen" style="display:none;" class="card">
  <h2 style="color:#4da6ff; text-align:center;">🏆 Bảng Xếp Hạng &amp; Đáp Án</h2>
  <p id="publicStatus" style="text-align:center; color:#888;"></p>
  <div id="publicLeaderboard"></div>
  <div id="publicAnswers" style="margin-top:20px;"></div>
  <button onclick="hidePublicResults()" style="margin-top:15px; background:#333;">⬅ Quay lại</button>
</div>

<!-- BƯỚC 2: ĐẶT CƯỢC -->
<form id="betForm" style="display:none;">
  <div id="questionsContainer"></div>
  <button type="button" id="submitBtn" onclick="submitBets()">CHỐT ĐƠN ĐẶT CƯỢC</button>
</form>

<!-- BƯỚC 3: CHỜ KẾT QUẢ -->
<div id="waitingScreen" style="display:none;" class="card center">
  <div class="big-emoji">⏳</div>
  <h2 style="color:#28a745;">Đã nộp bài thành công!</h2>
  <p><strong>Đội:</strong> <span id="waitTeamName"></span></p>
  <p><strong>Tổng xu đã đặt:</strong> <span id="waitTotalCoins"></span> / <span id="waitTotalBudget">100</span> xu</p>
  <p class="muted">Đang chờ Giáo Viên công bố đáp án đúng...</p>
  <div class="spinner"></div>
  <p class="muted" id="submittedCount"></p>
</div>

<!-- BƯỚC 4: KẾT QUẢ -->
<div id="resultScreen" style="display:none;" class="card">
  <h2 style="color: #28a745; text-align: center;">KẾT QUẢ ĐẶT CƯỢC</h2>
  <p><strong>Đội:</strong> <span id="resTeamName"></span></p>
  <p><strong>Số xu cuối cùng:</strong> <span id="resFinalBalance" style="color:#ffd700; font-weight:bold;"></span> xu</p>
  <table class="summary-table">
    <thead>
      <tr><th>Câu</th><th>Bạn cược</th><th>Đáp án đúng</th><th>Kết quả</th><th>Xu nhận</th></tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>
  <h3 style="margin-top:25px;">🏆 Bảng Xếp Hạng Lớp</h3>
  <div id="leaderboard"></div>
</div>

<script>
  // ====== CẤU HÌNH FIREBASE (đã gộp sẵn, không cần file riêng) ======
  const firebaseConfig = {
    apiKey: "AIzaSyApHRQfZumiQFj7-CiTU1VRuTMJHeXruTA",
    authDomain: "stgameofcoyen.firebaseapp.com",
    databaseURL: "https://stgameofcoyen-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "stgameofcoyen",
    storageBucket: "stgameofcoyen.firebasestorage.app",
    messagingSenderId: "36002056638",
    appId: "1:36002056638:web:4322394e81b1d6bd0c91ef"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function safeTeamKey(name) { return name.trim().replace(/[.#$\[\]\/]/g, "_"); }
  let TOTAL_QUESTIONS = 10; // giá trị mặc định, sẽ được ghi đè theo số câu cô cấu hình ở trang admin
  let NUM_OPTIONS = 3; // giá trị mặc định, sẽ được ghi đè theo số đáp án/câu cô cấu hình ở trang admin
  function OPT_LETTERS() { return Array.from({length: NUM_OPTIONS}, (_,i)=>String.fromCharCode(65+i)); }
  function emptyBets() {
    const bets = {};
    const letters = OPT_LETTERS();
    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      bets[i] = {};
      letters.forEach(o => bets[i][o] = 0);
    }
    return bets;
  }

  let TOTAL_BUDGET = 100; // giá trị mặc định, sẽ được ghi đè theo số xu cô cấu hình ở trang admin
  let currentTeamKey = null;
  let currentTeamName = null;
  let currentBets = {};
  let hasSubmitted = false;
  let gameState = { status: "open", correctAnswers: {} };

  // Cảnh báo trước khi rời trang nếu đang gõ dở cược (chưa nộp bài) để tránh mất công gõ lại
  window.addEventListener('beforeunload', function (e) {
    const formVisible = document.getElementById('betForm').style.display !== 'none';
    if (!formVisible || hasSubmitted) return;
    let hasAnyBet = false;
    document.querySelectorAll('.coin-input').forEach(input => { if ((parseInt(input.value) || 0) > 0) hasAnyBet = true; });
    if (hasAnyBet) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // Lắng nghe trạng thái ván chơi theo thời gian thực
  db.ref('game').on('value', snap => {
    gameState = snap.val() || { status: "open", correctAnswers: {} };
    updateStatusPill();
    if (gameState.status !== 'revealed') revealEffectPlayed = false;
    if (gameState.status === 'revealed' && hasSubmitted) {
      showResults();
    }
    if (document.getElementById('publicResultsScreen').style.display !== 'none') {
      renderPublicResults();
    }
  });

  // Đếm ngược thời gian đặt cược (do giáo viên đặt bên trang admin)
  let studentCountdownInterval = null;
  db.ref('game/countdownEndTime').on('value', snap => {
    const endTime = snap.val();
    if (studentCountdownInterval) clearInterval(studentCountdownInterval);
    const banner = document.getElementById('countdownBanner');
    if (!endTime) { banner.style.display = 'none'; return; }
    banner.style.display = 'block';
    studentCountdownInterval = setInterval(() => {
      const remain = endTime - Date.now();
      if (remain <= 0) {
        banner.textContent = '⏰ Đã hết giờ đặt cược!';
        clearInterval(studentCountdownInterval);
        if (gameState.status === 'open') db.ref('game/status').set('locked');
        return;
      }
      const m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
      banner.textContent = `⏳ Còn ${m}:${s.toString().padStart(2,'0')} để đặt cược`;
    }, 1000);
  });

  function updateStatusPill() {
    const pill = document.getElementById('statusPill');
    if (gameState.status === 'locked') {
      pill.textContent = '🔒 Đã khoá cược';
      pill.className = 'status-pill status-locked';
    } else if (gameState.status === 'revealed') {
      pill.textContent = '✅ Đã công bố kết quả';
      pill.className = 'status-pill status-revealed';
    } else {
      pill.textContent = '🟢 Đang mở cược';
      pill.className = 'status-pill status-open';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  // Câu hỏi mặc định (hiện ngay cả khi giáo viên chưa nhập gì trong trang admin) — Câu 5-10 để trống, chờ cô điền
  const DEFAULT_QUESTIONS = {
    1: { text: "According to John, what is the main advantage of space exploration?", options: { A: "To supply resources for use on Earth.", B: "To find out more about the origins of the planet.", C: "To establish a colony for humans if Earth becomes uninhabitable." } },
    2: { text: "According to the speakers, why can't robots be sent into space instead of humans?", options: { A: "They cannot operate for long enough.", B: "They are too expensive to build.", C: "They are too reliant on humans." } },
    3: { text: "What are we told about the space technology currently used?", options: { A: "It can be unreliable.", B: "It is based on old technology.", C: "It is becoming cheaper to produce." } },
    4: { text: "What is the biggest problem in sending robots to Mars?", options: { A: "the distance", B: "the atmosphere", C: "the extreme temperatures" } }
  };

  function buildQuestionCards() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    const letters = OPT_LETTERS();
    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      container.innerHTML += `
        <div class="card">
          <h3><span id="qtitle-${i}">Câu ${i}</span> <span class="q-total" id="qtotal-${i}"></span></h3>
          <div class="options-list" id="optlist-${i}"></div>
          <div class="input-group">
            ${letters.map(o => `
            <div class="input-box" id="box-${i}-${o}">
              <label>${o}</label>
              <input type="number" class="coin-input" data-q="${i}" data-opt="${o}" min="0" max="${TOTAL_BUDGET}" value="0" oninput="updateCoins()">
            </div>`).join('')}
          </div>
        </div>`;
    }
  }

  let latestQuestionsData = {};

  function renderQuestionText() {
    const letters = OPT_LETTERS();
    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      const q = latestQuestionsData[i] || DEFAULT_QUESTIONS[i];
      const titleEl = document.getElementById(`qtitle-${i}`);
      if (titleEl) titleEl.textContent = (q && q.text) ? `Câu ${i}: ${q.text}` : `Câu ${i}`;
      const listEl = document.getElementById(`optlist-${i}`);
      if (listEl) {
        if (q && q.options && letters.some(o => q.options[o])) {
          listEl.innerHTML = letters.map(o => q.options[o] ? `<div><strong>${o}.</strong> ${q.options[o]}</div>` : '').join('');
        } else {
          listEl.innerHTML = '';
        }
      }
    }
  }

  function captureCurrentBetsFromInputs() {
    const b = {};
    document.querySelectorAll('.coin-input').forEach(input => {
      const q = input.getAttribute('data-q'), opt = input.getAttribute('data-opt');
      if (!b[q]) b[q] = {};
      b[q][opt] = parseInt(input.value) || 0;
    });
    return b;
  }

  let readyResolved = false;
  let resolveReady;
  let readyPromise = new Promise(res => { resolveReady = res; });
  let configLoadedFlags = { total: false, options: false, budget: false };

  function rebuildIfNeeded() {
    const stillFillingForm = readyResolved && !hasSubmitted && document.getElementById('betForm').style.display !== 'none';
    const preserved = stillFillingForm ? captureCurrentBetsFromInputs() : null;

    if (!readyResolved || stillFillingForm) {
      buildQuestionCards();
      renderQuestionText();
      if (preserved) {
        Object.keys(preserved).forEach(q => {
          Object.keys(preserved[q]).forEach(opt => {
            const el = document.querySelector(`.coin-input[data-q="${q}"][data-opt="${opt}"]`);
            if (el && preserved[q][opt]) el.value = preserved[q][opt];
          });
        });
        updateCoins();
      }
    }
  }

  function checkReady() {
    if (readyResolved) return;
    if (configLoadedFlags.total && configLoadedFlags.options && configLoadedFlags.budget) {
      buildQuestionCards();
      renderQuestionText();
      readyResolved = true;
      resolveReady();
    }
  }

  // Lắng nghe số lượng câu hỏi, số đáp án/câu & tổng số xu LIÊN TỤC — nếu cô sửa giữa lúc học sinh đang làm, form tự cập nhật ngay, không mất xu đã nhập cho các câu/đáp án còn giữ nguyên
  db.ref('game/totalQuestions').on('value', snap => {
    TOTAL_QUESTIONS = snap.val() || 10;
    configLoadedFlags.total = true;
    if (readyResolved) rebuildIfNeeded(); else checkReady();
  });

  db.ref('game/numOptions').on('value', snap => {
    NUM_OPTIONS = snap.val() || 3;
    configLoadedFlags.options = true;
    if (readyResolved) rebuildIfNeeded(); else checkReady();
  });

  db.ref('game/totalBudget').on('value', snap => {
    TOTAL_BUDGET = snap.val() || 100;
    configLoadedFlags.budget = true;
    document.querySelectorAll('.coin-input').forEach(input => input.max = TOTAL_BUDGET);
    if (readyResolved) { updateCoins(); }
    else { document.getElementById('coinDisplay').textContent = `${TOTAL_BUDGET} / ${TOTAL_BUDGET} xu`; }
    checkReady();
  });

  db.ref('game/questions').on('value', snap => {
    latestQuestionsData = snap.val() || {};
    renderQuestionText();
  });

  // ====== XEM BẢNG XẾP HẠNG & ĐÁP ÁN CÔNG KHAI (không cần tham gia đội) ======
  function showPublicResults() {
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('publicResultsScreen').style.display = 'block';
    renderPublicResults();
  }

  function hidePublicResults() {
    document.getElementById('publicResultsScreen').style.display = 'none';
    document.getElementById('joinScreen').style.display = 'block';
  }

  async function renderPublicResults() {
    await readyPromise; // đảm bảo đã biết số câu hỏi
    const statusEl = document.getElementById('publicStatus');
    const lbEl = document.getElementById('publicLeaderboard');
    const ansEl = document.getElementById('publicAnswers');

    if (gameState.status !== 'revealed') {
      statusEl.textContent = 'Giáo viên chưa công bố kết quả — quay lại sau nhé!';
      lbEl.innerHTML = '';
      ansEl.innerHTML = '';
      return;
    }
    statusEl.textContent = '';

    const teamsSnap = await db.ref('teams').once('value');
    const teams = Object.values(teamsSnap.val() || {}).filter(t => t.submitted);
    teams.sort((a, b) => (b.balance || 0) - (a.balance || 0));
    const medals = ['🥇', '🥈', '🥉'];
    lbEl.innerHTML = '<h3>Bảng xếp hạng</h3>' + (teams.map((t, i) =>
      `<div class="leader-row"><span><span class="rank">${medals[i] || (i + 1)}</span> ${t.name}</span><strong>${t.balance} xu</strong></div>`
    ).join('') || '<p class="muted">Chưa có đội nào nộp bài</p>');

    const answersSnap = await db.ref('answers').once('value');
    const answers = answersSnap.val() || {};
    let html = '<h3 style="margin-top:20px;">Đáp án đúng</h3><table class="summary-table"><thead><tr><th>Câu</th><th>Đáp án đúng</th></tr></thead><tbody>';
    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      html += `<tr><td>Câu ${i}</td><td>${answers[i] || '—'}</td></tr>`;
    }
    html += '</tbody></table>';
    ansEl.innerHTML = html;
  }

  async function joinTeam() {
    const name = document.getElementById('teamNameInput').value.trim();
    if (!name) { showError('Vui lòng nhập tên đội!'); return; }
    document.getElementById('joinBtn').disabled = true;
    document.getElementById('joinBtn').textContent = 'Đang kiểm tra...';
    await readyPromise; // đảm bảo đã biết số lượng câu hỏi trước khi tạo/join đội

    const key = safeTeamKey(name);
    const ref = db.ref('teams/' + key);

    // Kiểm tra trước: nếu ván đã công bố kết quả và đội này CHƯA từng tồn tại/nộp bài, chặn ngay từ đầu, không tạo đội "rác"
    if (gameState.status === 'revealed') {
      const existingSnap = await ref.once('value');
      const existing = existingSnap.val();
      if (!existing || !existing.submitted) {
        showError('Ván chơi này đã kết thúc và công bố kết quả rồi, bạn không kịp tham gia. Chờ giáo viên bắt đầu ván mới nhé.');
        document.getElementById('joinBtn').disabled = false;
        document.getElementById('joinBtn').textContent = 'VÀO TRÒ CHƠI';
        return;
      }
    }

    try {
      const result = await ref.transaction(current => {
        if (current === null) {
          return { name: name, bets: emptyBets(), submitted: false, balance: TOTAL_BUDGET, createdAt: Date.now() };
        }
        return current; // đội đã tồn tại -> không ghi đè, chỉ cho tham gia lại (rejoin)
      });

      const data = result.snapshot.val();
      currentTeamKey = key;
      currentTeamName = data.name;
      hasSubmitted = !!data.submitted;
      currentBets = data.bets || emptyBets();
      document.getElementById('headerTeamName').textContent = currentTeamName.toUpperCase();
      document.getElementById('joinScreen').style.display = 'none';

      if (hasSubmitted) {
        if (gameState.status === 'revealed') {
          showResults();
        } else {
          showWaitingScreen();
        }
      } else {
        if (gameState.status === 'locked' || gameState.status === 'revealed') {
          showError(gameState.status === 'revealed'
            ? 'Ván chơi này đã kết thúc và công bố kết quả rồi, bạn không kịp tham gia. Chờ giáo viên bắt đầu ván mới nhé.'
            : 'Giáo viên đã khoá đặt cược, bạn không kịp tham gia lần này.');
          document.getElementById('joinScreen').style.display = 'block';
          document.getElementById('joinBtn').disabled = false;
          document.getElementById('joinBtn').textContent = 'VÀO TRÒ CHƠI';
          return;
        }
        // Điền lại các giá trị đã lưu dở (nếu có) rồi hiện form cược
        document.querySelectorAll('.coin-input').forEach(input => {
          const q = input.getAttribute('data-q'), opt = input.getAttribute('data-opt');
          input.value = (currentBets[q] && currentBets[q][opt]) || 0;
        });
        document.getElementById('betForm').style.display = 'block';
        updateCoins();
      }
    } catch (e) {
      showError('Lỗi kết nối Firebase: ' + e.message);
      document.getElementById('joinBtn').disabled = false;
      document.getElementById('joinBtn').textContent = 'VÀO TRÒ CHƠI';
    }
  }

  function updateCoins() {
    let spent = 0;
    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      let qspent = 0;
      document.querySelectorAll(`.coin-input[data-q="${i}"]`).forEach(input => {
        let val = parseInt(input.value) || 0;
        if (val < 0) input.value = 0;
        qspent += val;
      });
      const qtotalEl = document.getElementById(`qtotal-${i}`);
      if (qtotalEl) qtotalEl.textContent = qspent > 0 ? `(${qspent} xu)` : '';
      spent += qspent;
    }

    let remaining = TOTAL_BUDGET - spent;
    const display = document.getElementById('coinDisplay');
    const btn = document.getElementById('submitBtn');
    const isOver = remaining < 0;

    // Tô đỏ trực tiếp các ô đang có xu (không chỉ báo tổng cuối cùng) khi vượt ngân sách, để học sinh biết ngay cần bớt ô nào
    document.querySelectorAll('.coin-input').forEach(input => {
      const val = parseInt(input.value) || 0;
      input.classList.toggle('over-budget', isOver && val > 0);
    });

    if (isOver) {
      display.innerText = `VƯỢT QUÁ ${Math.abs(remaining)} XU!`;
      display.style.color = '#ff4d4d';
      btn.disabled = true;
    } else {
      display.innerText = `${remaining} / ${TOTAL_BUDGET} xu còn lại`;
      display.style.color = '#ffd700';
      btn.disabled = (gameState.status === 'locked' || gameState.status === 'revealed');
    }
  }

  async function submitBets() {
    if (gameState.status === 'locked') { showError('Giáo viên vừa khoá đặt cược!'); return; }
    if (gameState.status === 'revealed') { showError('Ván chơi đã kết thúc và công bố kết quả rồi, không thể nộp bài nữa.'); return; }

    let spent = 0;
    let bets = emptyBets();
    document.querySelectorAll('.coin-input').forEach(input => {
      let q = input.getAttribute('data-q');
      let opt = input.getAttribute('data-opt');
      let val = parseInt(input.value) || 0;
      bets[q][opt] = val;
      spent += val;
    });

    if (spent > TOTAL_BUDGET) { showError(`Bạn đặt quá ${TOTAL_BUDGET} xu! Hãy chỉnh lại.`); return; }
    if (spent === 0) { if (!confirm('Bạn chưa đặt xu nào cả, chắc chắn nộp bài trống?')) return; }

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').textContent = 'Đang nộp...';

    try {
      await db.ref('teams/' + currentTeamKey).update({
        bets: bets,
        submitted: true,
        submittedAt: Date.now()
      });
      currentBets = bets;
      hasSubmitted = true;
      document.getElementById('betForm').style.display = 'none';
      showWaitingScreen();
    } catch (e) {
      showError('Lỗi khi nộp bài: ' + e.message);
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = 'CHỐT ĐƠN ĐẶT CƯỢC';
    }
  }

  function showWaitingScreen() {
    let spent = 0;
    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      const b = currentBets[i] || {};
      spent += Object.values(b).reduce((s, v) => s + (v || 0), 0);
    }
    document.getElementById('waitTeamName').textContent = currentTeamName;
    document.getElementById('waitTotalCoins').textContent = spent;
    document.getElementById('waitTotalBudget').textContent = TOTAL_BUDGET;
    document.getElementById('waitingScreen').style.display = 'block';

    // Đếm số đội đã nộp bài, để tạo cảm giác hồi hộp chờ cả lớp
    db.ref('teams').on('value', snap => {
      const teams = snap.val() || {};
      const total = Object.keys(teams).length;
      const submitted = Object.values(teams).filter(t => t.submitted).length;
      const el = document.getElementById('submittedCount');
      if (el) el.textContent = `Đã có ${submitted} / ${total} đội nộp bài`;
    });
  }

  // ====== HIỆU ỨNG KHI CÔNG BỐ KẾT QUẢ (chỉ phát 1 lần mỗi lần công bố) ======
  let revealEffectPlayed = false;

  function playRevealSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.0001, now + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.2, now + i * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.9);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + i * 0.12);
        osc.stop(now + i * 0.12 + 0.9);
      });
    } catch (e) { /* trình duyệt không hỗ trợ âm thanh -> bỏ qua, không ảnh hưởng gì khác */ }
  }

  function launchConfetti() {
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const colors = ['#ffd700', '#28a745', '#4da6ff', '#ff4d4d', '#ffb84d'];
    const particles = Array.from({ length: 110 }, () => ({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.3,
      r: 4 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: 2 + Math.random() * 3,
      vx: -1.5 + Math.random() * 3,
      rot: Math.random() * 360,
      vrot: -6 + Math.random() * 12
    }));
    let frame = 0;
    function draw() {
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
        ctx.restore();
      });
      if (frame < 220) requestAnimationFrame(draw); else canvas.remove();
    }
    draw();
  }

  function showResults() {
    document.getElementById('waitingScreen').style.display = 'none';
    document.getElementById('betForm').style.display = 'none';
    document.getElementById('joinScreen').style.display = 'none';

    if (!revealEffectPlayed) {
      revealEffectPlayed = true;
      playRevealSound();
      launchConfetti();
    }

    db.ref('teams/' + currentTeamKey).once('value').then(snap => {
      const team = snap.val();
      if (!team) return;
      document.getElementById('resTeamName').textContent = team.name;
      document.getElementById('resFinalBalance').textContent = team.balance;

      const tbody = document.getElementById('summaryBody');
      tbody.innerHTML = '';
      const results = team.results || {};
      for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
        const r = results[i];
        if (!r) continue;
        const yourBets = Object.entries(r.bet).filter(([k,v]) => v > 0).map(([k,v]) => `${k}:${v}`).join(', ') || '—';
        tbody.innerHTML += `
          <tr class="${r.won ? 'won' : 'lost'}">
            <td><strong>Q${i}</strong></td>
            <td>${yourBets}</td>
            <td>${r.correct}</td>
            <td>${r.won ? '✅ Thắng' : '❌ Thua'}</td>
            <td>${r.payout > 0 ? '+' + r.payout : 0}</td>
          </tr>`;
      }
      document.getElementById('resultScreen').style.display = 'block';
    });

    db.ref('teams').once('value').then(snap => {
      const teams = Object.values(snap.val() || {}).filter(t => t.submitted);
      teams.sort((a, b) => (b.balance || 0) - (a.balance || 0));
      const medals = ['🥇', '🥈', '🥉'];
      document.getElementById('leaderboard').innerHTML = teams.map((t, i) =>
        `<div class="leader-row"><span><span class="rank">${medals[i] || (i+1)}</span> ${t.name}</span><strong>${t.balance} xu</strong></div>`
      ).join('');
    });
  }
</script>
